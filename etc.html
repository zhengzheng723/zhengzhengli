<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#ebebeb;
  --ink:#111;
  --muted:#888;
  --faint:#ccc;
  --mono:"DM Mono",monospace;
  --sans:"DM Sans",sans-serif;
}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;min-height:100vh;}

/* NAV */
nav{
  position:fixed;top:0;left:0;right:0;
  display:flex;justify-content:space-between;align-items:center;
  padding:22px 36px;z-index:100;
}
.nav-center{
  position:fixed;
  top:28px;
  left:50%;
  transform:translateX(-50%);
  font-family:var(--mono);
  font-size:12px;
  color:var(--ink);
  letter-spacing:.1em;
  z-index:100;
}

/* GRID */
.grid{
  padding:110px 2px 120px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:2px;
}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.grid{grid-template-columns:1fr;padding:80px 2px 80px;}}

.grid-item{
  position:relative;overflow:hidden;cursor:pointer;
  background:#d8d8d6;
  aspect-ratio:1/1;
  /* hidden by default, shown once image loads */
  display:none;
}
.grid-item.loaded{display:block;}
.grid-item img{
  display:block;width:100%;height:100%;
  object-fit:cover;
  transition:opacity .35s ease,transform .5s ease;
}
.grid-item:hover img{opacity:.85;transform:scale(1.04);}
.grid-item .caption{
  position:absolute;bottom:0;left:0;right:0;
  padding:10px 12px;
  background:linear-gradient(transparent,rgba(0,0,0,.3));
  font-family:var(--mono);font-size:9px;color:white;letter-spacing:.1em;
  opacity:0;transform:translateY(4px);
  transition:opacity .25s ease,transform .25s ease;
}
.grid-item:hover .caption{opacity:1;transform:translateY(0);}

/* DRAG & DROP */
.grid-item.drag-source{opacity:.35;transform:scale(.96);}
.grid-item.drag-over{outline:2px solid rgba(17,17,17,.5);outline-offset:-2px;}

/* EDIT MODE TOGGLE */
.edit-btn{
  position:fixed;bottom:28px;right:28px;
  font-family:var(--mono);font-size:10px;color:var(--muted);
  background:var(--bg);border:1px solid #ccc;border-radius:20px;
  padding:7px 16px;cursor:pointer;z-index:300;
  transition:all .2s;letter-spacing:.06em;
}
.edit-btn:hover,.edit-btn.active{color:var(--ink);border-color:#999;}
.edit-btn.active{background:#111;color:#fff;border-color:#111;}

.save-btn{
  position:fixed;bottom:28px;right:130px;
  font-family:var(--mono);font-size:10px;color:#fff;
  background:#111;border:1px solid #111;border-radius:20px;
  padding:7px 16px;cursor:pointer;z-index:300;
  letter-spacing:.06em;
  opacity:0;pointer-events:none;
  transition:opacity .2s;
}
.save-btn.visible{opacity:1;pointer-events:all;}

/* PASSWORD MODAL */
.pw-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(235,235,235,.97);
  z-index:800;align-items:center;justify-content:center;
}
.pw-overlay.on{display:flex;}
.pw-box{
  display:flex;flex-direction:column;align-items:center;gap:18px;
  padding:48px 40px;
}
.pw-label{
  font-family:var(--mono);font-size:11px;color:var(--muted);
  letter-spacing:.12em;
}
.pw-input{
  font-family:var(--mono);font-size:13px;color:var(--ink);
  background:none;border:none;border-bottom:1px solid #bbb;
  padding:6px 2px;outline:none;width:180px;text-align:center;
  letter-spacing:.18em;
  transition:border-color .2s;
}
.pw-input:focus{border-color:var(--ink);}
.pw-error{
  font-family:var(--mono);font-size:10px;color:#c0392b;
  letter-spacing:.08em;opacity:0;transition:opacity .2s;
}
.pw-error.show{opacity:1;}
.pw-hint{
  font-family:var(--mono);font-size:9px;color:var(--faint);
  letter-spacing:.06em;margin-top:4px;
}

/* LIGHTBOX */
.lb{
  display:none;position:fixed;inset:0;
  background:rgba(235,235,235,.96);
  z-index:500;align-items:center;justify-content:center;flex-direction:column;
}
.lb.on{display:flex;}
.lb img{max-width:82vw;max-height:80vh;object-fit:contain;display:block;}
.lb-meta{
  margin-top:18px;font-family:var(--mono);
  font-size:10px;color:var(--muted);letter-spacing:.1em;text-align:center;
}
.lb-close-wrap{
  position:fixed;top:22px;right:36px;
  cursor:pointer;
}
.lb-nav{
  position:fixed;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:13px;color:var(--muted);
  cursor:pointer;background:none;border:none;
  padding:20px;transition:color .2s;letter-spacing:.06em;user-select:none;
}
.lb-nav:hover{color:var(--ink);}
.lb-nav.prev{left:20px;}
.lb-nav.next{right:20px;}

/* TICKER */
.ticker-wrap{
  position:fixed;top:52px;left:0;right:0;
  overflow:hidden;pointer-events:none;z-index:99;
}
.ticker-track{
  display:flex;white-space:nowrap;
  animation:ticker-rtl 34s linear infinite;
}
.ticker-item{
  display:inline-block;padding-left:100vw;
  font-family:var(--mono);font-size:10px;color:var(--muted);
  letter-spacing:.06em;font-style:italic;
}
.ticker-wrap::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:180px;
  background:linear-gradient(to right,var(--bg) 20%,transparent 100%);
  z-index:2;pointer-events:none;
}
@keyframes ticker-rtl{0%{transform:translateX(0);}100%{transform:translateX(-100%);}}

/* TOAST */
.toast{
  position:fixed;bottom:72px;left:50%;transform:translateX(-50%);
  background:#111;color:#ccc;padding:8px 18px;border-radius:20px;
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;
  z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none;
}
.toast.show{opacity:1;}
</style>

<script>
// ── PHOTO LIST ──────────────────────────────────────────────────────────────
// All possible photos. Missing ones are automatically hidden.
const ALL_PHOTOS = Array.from({length:85}, (_,i)=>`photos/${String(i+1).padStart(3,'0')}.jpg`);

// Order stored in localStorage; falls back to default
function loadOrder(){
  try{
    const s = localStorage.getItem('etc_order');
    if(s) return JSON.parse(s);
  }catch(e){}
  return [...ALL_PHOTOS];
}
function saveOrder(){
  const items = [...document.querySelectorAll('.grid-item.loaded')];
  const order = items.map(el=>el.dataset.src);
  try{ localStorage.setItem('etc_order', JSON.stringify(order)); }catch(e){}
  showToast('Order saved ✓');
}

// ── BUILD GRID ──────────────────────────────────────────────────────────────
const grid = document.getElementById('photoGrid');
let photoOrder = loadOrder();

function buildGrid(order){
  grid.innerHTML = '';
  order.forEach((src, i) => {
    const item = document.createElement('div');
    item.className = 'grid-item';
    item.dataset.src = src;

    const img = document.createElement('img');
    img.src = src;
    img.alt = '';

    // Only show if image actually loads
    img.onload = () => {
      item.classList.add('loaded');
      item.onclick = () => openLb(getLoadedIndex(item));
    };
    img.onerror = () => { /* stays hidden */ };

    const cap = document.createElement('div');
    cap.className = 'caption';
    cap.textContent = src.replace('photos/','').replace('.jpg','');

    item.appendChild(img);
    item.appendChild(cap);
    grid.appendChild(item);
  });
}

function getLoadedIndex(targetItem){
  const loaded = [...document.querySelectorAll('.grid-item.loaded')];
  return loaded.indexOf(targetItem);
}

buildGrid(photoOrder);

// ── LIGHTBOX ────────────────────────────────────────────────────────────────
let cur = 0;

function openLb(idx){
  cur = idx;
  renderLb();
  document.getElementById('lb').classList.add('on');
}
function closeLb(){
  document.getElementById('lb').classList.remove('on');
}
function navLb(dir){
  const items = document.querySelectorAll('.grid-item.loaded');
  cur = (cur + dir + items.length) % items.length;
  renderLb();
}
function renderLb(){
  const items = [...document.querySelectorAll('.grid-item.loaded')];
  if(!items[cur]) return;
  const img  = items[cur].querySelector('img');
  const cap  = items[cur].querySelector('.caption');
  document.getElementById('lbImg').src = img ? img.src : '';
  document.getElementById('lbMeta').textContent =
    (cap ? cap.textContent.trim() : '') + ' — ' + (cur+1) + ' / ' + items.length;
}
document.addEventListener('keydown', e => {
  if(!document.getElementById('lb').classList.contains('on')) return;
  if(e.key==='ArrowRight') navLb(1);
  if(e.key==='ArrowLeft')  navLb(-1);
  if(e.key==='Escape')     closeLb();
});
document.getElementById('lb').addEventListener('click', function(e){
  if(e.target===this) closeLb();
});

// ── ADMIN PASSWORD ───────────────────────────────────────────────────────────
// Change this to your own password:
const ADMIN_PASSWORD = 'zhengzheng';
let adminUnlocked = false;

function requestEdit(){
  if(adminUnlocked){
    toggleEdit();
  } else {
    document.getElementById('pwOverlay').classList.add('on');
    document.getElementById('pwInput').value = '';
    document.getElementById('pwError').classList.remove('show');
    setTimeout(()=>document.getElementById('pwInput').focus(), 50);
  }
}
function checkPassword(){
  const val = document.getElementById('pwInput').value;
  if(val === ADMIN_PASSWORD){
    adminUnlocked = true;
    closePw();
    toggleEdit();
  } else {
    const err = document.getElementById('pwError');
    err.classList.add('show');
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
    setTimeout(()=>err.classList.remove('show'), 2000);
  }
}
function closePw(){
  document.getElementById('pwOverlay').classList.remove('on');
}
document.addEventListener('keydown', e=>{
  if(document.getElementById('pwOverlay').classList.contains('on') && e.key==='Escape') closePw();
});

// ── DRAG & DROP REORDER ─────────────────────────────────────────────────────
let editMode = false;
let dragSrc = null;

function toggleEdit(){
  editMode = !editMode;
  document.getElementById('editBtn').classList.toggle('active', editMode);
  document.getElementById('saveBtn').classList.toggle('visible', editMode);

  document.querySelectorAll('.grid-item.loaded').forEach(item => {
    if(editMode){
      item.draggable = true;
      item.onclick = null; // disable lightbox in edit mode
      item.addEventListener('dragstart', onDragStart);
      item.addEventListener('dragover',  onDragOver);
      item.addEventListener('dragleave', onDragLeave);
      item.addEventListener('drop',      onDrop);
      item.addEventListener('dragend',   onDragEnd);
    } else {
      item.draggable = false;
      item.removeEventListener('dragstart', onDragStart);
      item.removeEventListener('dragover',  onDragOver);
      item.removeEventListener('dragleave', onDragLeave);
      item.removeEventListener('drop',      onDrop);
      item.removeEventListener('dragend',   onDragEnd);
      // re-attach lightbox
      item.onclick = () => openLb(getLoadedIndex(item));
    }
  });

  if(editMode) showToast('Drag photos to reorder — then tap Save');
}

function onDragStart(e){
  dragSrc = this;
  this.classList.add('drag-source');
  e.dataTransfer.effectAllowed = 'move';
}
function onDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  if(this !== dragSrc) this.classList.add('drag-over');
}
function onDragLeave(){
  this.classList.remove('drag-over');
}
function onDrop(e){
  e.preventDefault();
  if(!dragSrc || dragSrc === this) return;
  this.classList.remove('drag-over');

  // Swap DOM positions
  const grid = document.getElementById('photoGrid');
  const items = [...grid.children];
  const srcIdx = items.indexOf(dragSrc);
  const dstIdx = items.indexOf(this);

  if(srcIdx < dstIdx){
    grid.insertBefore(dragSrc, this.nextSibling);
  } else {
    grid.insertBefore(dragSrc, this);
  }
}
function onDragEnd(){
  document.querySelectorAll('.grid-item').forEach(el=>{
    el.classList.remove('drag-source','drag-over');
  });
  dragSrc = null;
}

// ── TOAST ───────────────────────────────────────────────────────────────────
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

// ── CLOSE CREATURE SPIN ─────────────────────────────────────────────────────
let closeRot = 0;
const closeCreature = document.getElementById('closeCreature');
function spinClose(){
  closeRot += 1.5;
  if(closeCreature) closeCreature.style.transform = `rotate(${closeRot}deg)`;
  requestAnimationFrame(spinClose);
}
spinClose();

// ── EYE TRACKING (nav logo) ─────────────────────────────────────────────────
const etcEyes = [
  {pid:'elp1',hid:'elh1',cx:56,cy:50,maxR:4,hox:-6,hoy:-6},
  {pid:'elp2',hid:'elh2',cx:97,cy:37,maxR:2,hox:-4,hoy:-4},
  {pid:'elp3',hid:'elh3',cx:93,cy:65,maxR:2,hox:-2,hoy:-2},
];
document.addEventListener('mousemove', e => {
  const svg = document.getElementById('etcLogoSvg');
  if(!svg) return;
  const rect = svg.getBoundingClientRect();
  const mx = (e.clientX-rect.left)*(160/rect.width);
  const my = (e.clientY-rect.top)*(130/rect.height);
  etcEyes.forEach(eye=>{
    const p=document.getElementById(eye.pid),h=document.getElementById(eye.hid);
    if(!p||!h) return;
    const dx=mx-eye.cx,dy=my-eye.cy,dist=Math.sqrt(dx*dx+dy*dy);
    const move=Math.min(dist*.15,eye.maxR);
    const nx=dist>0?(dx/dist)*move:0, ny=dist>0?(dy/dist)*move:0;
    p.setAttribute('cx',(eye.cx+nx).toFixed(2)); p.setAttribute('cy',(eye.cy+ny).toFixed(2));
    h.setAttribute('cx',(eye.cx+nx+eye.hox).toFixed(2)); h.setAttribute('cy',(eye.cy+ny+eye.hoy).toFixed(2));
  });
});

// ── EYE TRACKING (close creature) ───────────────────────────────────────────
const closeEyes = [
  {pid:'clp1',hid:'clh1',cx:56,cy:50,maxR:4,hox:-6,hoy:-6},
  {pid:'clp2',hid:'clh2',cx:97,cy:37,maxR:2,hox:-4,hoy:-4},
  {pid:'clp3',hid:'clh3',cx:93,cy:65,maxR:2,hox:-2,hoy:-2},
];
document.addEventListener('mousemove', e => {
  const svg = document.getElementById('closeCreature');
  if(!svg) return;
  const rect = svg.getBoundingClientRect();
  const mx = (e.clientX-rect.left)*(160/rect.width);
  const my = (e.clientY-rect.top)*(130/rect.height);
  closeEyes.forEach(eye=>{
    const p=document.getElementById(eye.pid),h=document.getElementById(eye.hid);
    if(!p||!h) return;
    const dx=mx-eye.cx,dy=my-eye.cy,dist=Math.sqrt(dx*dx+dy*dy);
    const move=Math.min(dist*.15,eye.maxR);
    const nx=dist>0?(dx/dist)*move:0, ny=dist>0?(dy/dist)*move:0;
    p.setAttribute('cx',(eye.cx+nx).toFixed(2)); p.setAttribute('cy',(eye.cy+ny).toFixed(2));
    h.setAttribute('cx',(eye.cx+nx+eye.hox).toFixed(2)); h.setAttribute('cy',(eye.cy+ny+eye.hoy).toFixed(2));
  });
});

// ── RANDOM BLINK ────────────────────────────────────────────────────────────
function blink(pid){
  const p=document.getElementById(pid);
  if(!p) return;
  const r=p.getAttribute('r');
  p.setAttribute('r','0.5');
  setTimeout(()=>p.setAttribute('r',r),120);
}
function randomBlink(){
  blink(['elp1','elp2','elp3'][Math.floor(Math.random()*3)]);
  setTimeout(randomBlink, 2000+Math.random()*3000);
}
randomBlink();

// ── CREATURE DRIFT ───────────────────────────────────────────────────────────
(function(){
  const logo=document.getElementById('etcLogo');
  if(!logo) return;
  let posX=36,posY=22,velX=0,velY=0,mouseX=window.innerWidth/2,mouseY=window.innerHeight/2;
  document.addEventListener('mousemove',e=>{mouseX=e.clientX;mouseY=e.clientY;});
  let t=0;
  const px1=Math.random()*Math.PI*2,px2=Math.random()*Math.PI*2;
  const py1=Math.random()*Math.PI*2,py2=Math.random()*Math.PI*2;
  function drift(){
    t+=.002;
    const W=window.innerWidth,H=window.innerHeight;
    const cx=posX+44,cy=posY+36;
    const dx=mouseX-cx,dy=mouseY-cy,dist=Math.sqrt(dx*dx+dy*dy);
    const pull=Math.min(dist*.0003,.018);
    velX+=(dist>0?(dx/dist)*pull:0)+Math.sin(t*.9+px1)*.008+Math.sin(t*1.6+px2)*.004;
    velY+=(dist>0?(dy/dist)*pull:0)+Math.cos(t*.7+py1)*.008+Math.cos(t*1.3+py2)*.004;
    velX*=.96;velY*=.96;
    const spd=Math.sqrt(velX*velX+velY*velY);
    if(spd>.8){velX=velX/spd*.8;velY=velY/spd*.8;}
    posX+=velX;posY+=velY;
    if(posX<10){posX=10;velX=Math.abs(velX)*.5;}
    if(posX>W-88){posX=W-88;velX=-Math.abs(velX)*.5;}
    if(posY<10){posY=10;velY=Math.abs(velY)*.5;}
    if(posY>H-72){posY=H-72;velY=-Math.abs(velY)*.5;}
    logo.style.left=posX.toFixed(1)+'px';
    logo.style.top=posY.toFixed(1)+'px';
    requestAnimationFrame(drift);
  }
  drift();
})();

// ── TICKER WORD FADE ─────────────────────────────────────────────────────────
(function(){
  const FADE_ZONE=200;
  function updateFade(){
    document.querySelectorAll('.ticker-item .word').forEach(w=>{
      const r=w.getBoundingClientRect();
      w.style.opacity=r.right<0?'0':r.left<FADE_ZONE?Math.max(0,r.left/FADE_ZONE).toFixed(3):'1';
    });
    requestAnimationFrame(updateFade);
  }
  updateFade();
})();

// ── CLOSE LIGHTBOX EXPLOSION ─────────────────────────────────────────────────
function closeLbWithExplosion(){
  const btn=document.getElementById('lbCloseBtn');
  if(!btn){closeLb();return;}
  const rect=btn.getBoundingClientRect();
  const ox=rect.left+rect.width/2, oy=rect.top+rect.height/2;
  const COUNT=16, clones=[];
  const colors=['#111','#111','#111','#C8102E','#1A6FDB'];
  for(let i=0;i<COUNT;i++){
    const size=15+Math.random()*30, color=colors[Math.floor(Math.random()*colors.length)];
    const el=document.createElement('div');
    el.style.cssText='position:fixed;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);';
    el.innerHTML=`<svg viewBox="0 0 160 130" width="${size}" height="${Math.round(size*.82)}" style="overflow:visible;display:block;" xmlns="http://www.w3.org/2000/svg"><ellipse cx="76" cy="54" rx="54" ry="52" fill="${color}"/><circle cx="56" cy="50" r="13" fill="white"/><circle cx="56" cy="50" r="8" fill="${color}"/><circle cx="93" cy="62" r="9" fill="white"/><circle cx="93" cy="62" r="4" fill="${color}"/></svg>`;
    el.style.left=ox+'px';el.style.top=oy+'px';
    document.body.appendChild(el);
    const angle=(i/COUNT)*Math.PI*2+(Math.random()-.5)*.4;
    const spd=80+Math.random()*140;
    clones.push({el,tx:Math.cos(angle)*spd,ty:Math.sin(angle)*spd});
  }
  let start=null;
  (function anim(ts){
    if(!start) start=ts;
    const p=Math.min((ts-start)/600,1), ease=1-Math.pow(1-p,3);
    clones.forEach(c=>{
      c.el.style.left=(ox+c.tx*ease)+'px';
      c.el.style.top=(oy+c.ty*ease)+'px';
      c.el.style.opacity=(1-ease*.9).toFixed(3);
      c.el.style.transform=`translate(-50%,-50%) scale(${(.2+ease*.8).toFixed(2)})`;
    });
    if(p<1){requestAnimationFrame(anim);}
    else{clones.forEach(c=>{if(c.el.parentNode)c.el.remove();});closeLb();}
  })(performance.now());
}

// ── EXPLODE & GO HOME ────────────────────────────────────────────────────────
function makeMini(size,color){
  const el=document.createElement('div');
  el.style.cssText='position:fixed;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);';
  el.innerHTML=`<svg viewBox="0 0 160 130" width="${size}" height="${Math.round(size*.82)}" style="overflow:visible;display:block;" xmlns="http://www.w3.org/2000/svg"><circle cx="58" cy="8" r="12" fill="${color}"/><circle cx="81" cy="7" r="14" fill="${color}"/><circle cx="103" cy="10" r="11" fill="${color}"/><ellipse cx="76" cy="54" rx="54" ry="52" fill="${color}"/><circle cx="56" cy="50" r="13" fill="white"/><circle cx="56" cy="50" r="8" fill="${color}"/><circle cx="93" cy="62" r="9" fill="white"/><circle cx="93" cy="62" r="4" fill="${color}"/></svg>`;
  return el;
}
function explodeAndGo(url,e){
  const ox=(e&&e.clientX)?e.clientX:window.innerWidth/2;
  const oy=(e&&e.clientY)?e.clientY:window.innerHeight/2;
  const COUNT=40, clones=[], colors=['#111','#111','#111','#111','#C8102E','#1A6FDB'];
  for(let i=0;i<COUNT;i++){
    const size=12+Math.random()*50, color=colors[Math.floor(Math.random()*colors.length)];
    const el=makeMini(size,color);
    el.style.left=ox+'px';el.style.top=oy+'px';el.style.opacity='1';
    document.body.appendChild(el);
    clones.push({el,tx:(Math.random()*window.innerWidth)-ox,ty:(Math.random()*window.innerHeight)-oy});
  }
  let start=null;
  (function anim(ts){
    if(!start) start=ts;
    const p=Math.min((ts-start)/800,1), ease=1-Math.pow(1-p,3);
    clones.forEach(c=>{
      c.el.style.left=(ox+c.tx*ease)+'px';
      c.el.style.top=(oy+c.ty*ease)+'px';
      c.el.style.opacity=(1-ease*.9).toFixed(3);
      c.el.style.transform=`translate(-50%,-50%) scale(${(.1+ease).toFixed(2)})`;
    });
    if(p<1){requestAnimationFrame(anim);}
    else{clones.forEach(c=>{if(c.el.parentNode)c.el.remove();});setTimeout(()=>{window.location.href=url;},50);}
  })(performance.now());
}
</script>
